
services:
  - type: web
    name: podoc-api
    runtime: docker
    # PoRender uses rootDir as the Docker build context; Dockerfile paths
    # are relative to this directory (not the repository root).
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    disk:
      mountPath: /data/files
      sizeGB: 10
      # The Python image runs as root with all Linux capabilities dropped.
      uid: 0
      gid: 0

    x-porender:
      port: 10000
      # Decoding 4K/HEVC plus the API needs headroom beyond a 256 MiB container.
      memoryMiB: 1024
      cpu: 2
      healthTimeoutSeconds: 60

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: podoc-db
          property: connectionString

      - key: FILES_STORAGE_DIR
        value: "/data/files"

      - key: ADMIN_USERNAME
        value: "admin"

      - key: ADMIN_PASSWORD
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: RATE_LIMIT_LOGIN
        value: "10/minute"

databases:
  - name: podoc-db
    postgresMajorVersion: "16"
    databaseName: podoc
    user: podoc
    diskSizeGB: 1
